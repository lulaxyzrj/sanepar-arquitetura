premises:
  - DHuO é a plataforma corporativa de API Management (API Journey)
  - Duas esteiras: analítica (GET) e proxies (governança)
  - Sem integração direta OT/SCADA de controle
  - Pub/Sub proposto como desacoplamento — validar formalmente
  - Deploy elástico (menor tier inicial; monitorar USNs)

risks:
  - id: R1
    title: Contratos técnicos das APIs GET incompletos
    evidence: Aceite de dashboards/ML depende dos contratos das ~21 APIs analíticas
  - id: R2
    title: Misturar aceite analítico com proxies operacionais
    evidence: Pendências de proxies não devem travar dashboards/ML
  - id: R3
    title: Conectividade VPN
    evidence: VPC/subnet/peer e fechamento VPN pelo cliente
  - id: R4
    title: Sizing e custos ociosos
    evidence: Timing de infra vs faturamento; USNs
  - id: R5
    title: Licenciamento Looker / BI
    evidence: Embedding, SSO, compras
  - id: R6
    title: Definição incompleta dos demais dashboards e ML
    evidence: Clareza no 1º painel; faltam demais painéis e 2 modelos

currentPhase:
  items:
    - Separação esteira analítica vs proxies DHuO
    - Contratos das APIs GET analíticas
    - Fechamento VPN
    - Definição dos 5 dashboards e 2 modelos ML
    - Validação Pub/Sub / ingestão
    - Licenciamento BI
  recentDocuments:
    - dossie_tecnico_sanepar_dados_ia.md
    - SANEPAR-HISTORIAN-REST-API.docx.pdf

executiveConclusion: >
  Projeto de gestão de APIs (DHuO / API Journey), engenharia de dados (Data Journey)
  e analytics/IA (AI Journey) em GCP. Decisão-chave de HLD: separar esteira analítica
  (APIs GET → Pub/Sub → lakehouse → 5 dashboards + 2 ML) da esteira de proxies no DHuO
  (~150 APIs governadas).
