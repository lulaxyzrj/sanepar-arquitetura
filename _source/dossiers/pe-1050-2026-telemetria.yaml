connectivity:
  requirement: VPN Site-to-Site SANEPAR ⇄ Engineering/DHuO/GCP
  statusNotes:
    - Setup cloud GCP pronto do lado Engineering; VPN pelo cliente pendente (daily)
    - Necessário VPC, subnet, peer e rede antes do formulário VPN
  alternatives:
    - id: ha-vpn
      name: HA VPN
      profile: implementação rápida; custo menor
    - id: psc
      name: Private Service Connect (PSC)
      profile: aderente se LZ GCP existente
    - id: interconnect
      name: Cloud Interconnect
      profile: alta capacidade; maior complexidade/custo

