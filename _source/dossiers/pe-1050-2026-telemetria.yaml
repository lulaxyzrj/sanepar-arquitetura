overview:
  summary: >
    Implantação de plataforma integrada de dados, APIs, analytics e IA em GCP,
    com DHuO como plataforma corporativa de gestão/governança de APIs (API Manager),
    esteira analítica (GET → lakehouse / dashboards / ML) e esteira de proxies no DHuO.
  platform: DHuO
  platformRole: API Manager / API Gateway corporativo (API Journey)
  cloud: GCP
  region: southamerica-east1
  deliveryModel: SaaS Dedicado
  products:
    - API Gateway (DHuO)
    - API Manager (DHuO)
    - Developer Portal
    - iPaaS
    - Data Integration
    - Lakehouse / BigQuery
    - Pub/Sub (em validação)
    - Dashboards (5)
    - Modelos ML (2) + MLOps

offers:
  primary:
    - id: api-journey
      role: DHuO como API Manager corporativo — governança de ~150 APIs
    - id: data-journey
      role: Ingestão, lakehouse, histórico, streaming, catálogo
    - id: ai-journey
      role: 2 modelos preditivos + MLOps + dashboards analíticos

contract:
  processType: Pregão Eletrônico
  processId: PE 1050/2026
  object: Solução integrada para análise de dados de telemetria em nuvem
  technicalProposal: "Proposta técnica Engineering — PE 1050/2026"

dhuo:
  role: Plataforma padrão de gestão e governança de APIs da SANEPAR
  delivery: SaaS
  rule: >
    Todas as APIs da SANEPAR, independentemente do método HTTP, devem passar
    pelo DHuO para governança, controle de acessos, volumetria e throughput.
  forgeOffer: api-journey
  tracks:
    - id: analytical
      name: Esteira Analítica
      apisApprox: 21
      methods: [GET]
      feeds: [dashboards, lakehouse, ml]
    - id: proxies
      name: Esteira de Proxies / Governança
      focus: Publicação e governança das demais APIs no DHuO
      acceptanceHint: Conectividade e autenticação do endpoint

apis:
  estimatedCount: 150
  analyticalInitialApprox: 21
  proxiesApprox: 129
  governance: DHuO
  rule: >
    Todas as APIs deverão passar pelo DHuO para governança, independentemente
    de serem GET, POST ou outros métodos.
  scopeNote: >
    Consumir APIs existentes expostas pela SANEPAR; sem integração direta OT/SCADA
    (CLP/RTU/controle). Sem margem para construção de APIs novas complexas.
    CRN preliminar: 21 APIs mandatórias (5 dashboards + 2 ML) + 129 proxies.
  goals:
    - Controle de consumo
    - Throughput
    - Segurança
    - Monitoramento
    - Rate limiting
    - Gestão de consumidores

